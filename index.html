<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141f;--panel:#1b1e2d;--line:#2b3046;--text:#ecebf4;--mute:#9a9db5;--listen:#3ecfb2;--think:#f5b955;--speak:#8b7cff;--c:var(--mute)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f2f8;--panel:#fff;--line:#dcdbe8;--text:#1c1d2b;--mute:#6b6e86;--listen:#12a58a;--think:#c98a14;--speak:#6a5af0}}
:root[data-theme="light"]{--bg:#f3f2f8;--panel:#fff;--line:#dcdbe8;--text:#1c1d2b;--mute:#6b6e86;--listen:#12a58a;--think:#c98a14;--speak:#6a5af0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
header h1{font-size:1rem;font-weight:700;margin:0}
.tools{display:flex;gap:8px;align-items:center}
select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
main{flex:1;width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;padding:0 20px;min-height:0}
.stage{position:relative;width:220px;height:220px;margin:18px 0 8px;flex:none}
.orb{position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 40%,#000));transition:background .4s,transform .4s;box-shadow:0 0 60px color-mix(in srgb,var(--c) 45%,transparent)}
.ring{position:absolute;inset:30px;border-radius:50%;border:2px solid var(--c);opacity:0}
body[data-s="idle"]{--c:var(--mute)}
body[data-s="listening"]{--c:var(--listen)}
body[data-s="thinking"]{--c:var(--think)}
body[data-s="speaking"]{--c:var(--speak)}
body[data-s="listening"] .ring{animation:ring 2s ease-out infinite}
body[data-s="listening"] .ring:nth-child(2){animation-delay:1s}
body[data-s="thinking"] .orb{animation:spin 1.1s ease-in-out infinite alternate}
body[data-s="speaking"] .orb{animation:talk .55s ease-in-out infinite alternate}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.6);opacity:0}}
@keyframes spin{from{transform:scale(.92)}to{transform:scale(1.04)}}
@keyframes talk{from{transform:scale(.95)}to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.orb,.ring{animation:none!important}}
#status{font-size:1.15rem;font-weight:700;margin:4px 0 2px}
#hint{color:var(--mute);font-size:.9rem;margin:0 0 14px;text-align:center;min-height:1.3em}
#log{flex:1;width:100%;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 13px;border-radius:12px;line-height:1.5;font-size:.95rem;white-space:pre-wrap}
.m.u{align-self:flex-end;background:color-mix(in srgb,var(--listen) 22%,var(--panel))}
.m.a{align-self:flex-start;background:color-mix(in srgb,var(--speak) 20%,var(--panel))}
.m.live{opacity:.6}
.empty{color:var(--mute);margin:auto;text-align:center;font-size:.95rem}
footer{width:100%;max-width:720px;display:flex;justify-content:center;align-items:center;gap:12px;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
#go{background:var(--c);color:#10121c;border:0;font-weight:700;padding:14px 28px;border-radius:999px;font-size:1rem;min-width:170px}
label.t{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:.85rem}
</style>
</head>
<body data-s="idle">
<header>
  <h1>Voice Assistant</h1>
  <div class="tools">
    <select id="lang" aria-label="Language">
      <option value="en-US">English</option>
      <option value="ur-PK">اردو</option>
      <option value="hi-IN">हिन्दी</option>
    </select>
    <button id="theme" aria-label="Toggle theme">Theme</button>
  </div>
</header>
<main>
  <div class="stage" aria-hidden="true"><div class="ring"></div><div class="ring"></div><div class="orb"></div></div>
  <div id="status" role="status" aria-live="polite">Ready</div>
  <p id="hint">Press Start and begin speaking.</p>
  <div id="log"><p class="empty">Your conversation will appear here.</p></div>
</main>
<footer>
  <button id="go">Start</button>
  <button id="clear">Clear chat</button>
  <label class="t"><input type="checkbox" id="barge"> Allow interrupting (use headphones)</label>
</footer>
<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
let rec, active = false, speaking = false, streaming = false, utter = 0, ctrl = null, history = [], live = null;

const LABELS = {idle:"Ready", listening:"Listening", thinking:"Thinking", speaking:"Speaking"};
function setS(s){ document.body.dataset.s = s; $("status").textContent = LABELS[s]; }
function hint(t){ $("hint").textContent = t || ""; }

function bubble(cls, text){
  const log = $("log");
  const e = log.querySelector(".empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function listen(){
  if (!active || speaking || streaming) return;
  try { rec.start(); } catch(e) {}
  setS("listening"); hint("Speak now...");
}

function makeRec(){
  rec = new SR();
  rec.lang = $("lang").value; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    if ((interim || final) && speaking) interrupt();
    if (interim){
      if (!live) live = bubble("u live", "");
      live.textContent = interim;
    }
    if (final.trim()){
      if (live){ live.remove(); live = null; }
      ask(final.trim());
    }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){
      active = false; $("go").textContent = "Start"; setS("idle");
      hint("Microphone blocked. Allow mic access in the address bar and try again.");
    }
  };
  rec.onend = () => { if (active && !speaking && !streaming) setTimeout(listen, 150); };
}

function interrupt(){
  synth.cancel(); if (ctrl) ctrl.abort();
  speaking = false; streaming = false; utter = 0;
}

function speak(text){
  const t = text.trim(); if (!t) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = $("lang").value;
  u.onstart = () => { speaking = true; setS("speaking"); hint(""); if (!$("barge").checked) try{ rec.stop(); }catch(e){} };
  u.onend = u.onerror = () => { utter--; if (utter <= 0 && !streaming){ utter = 0; speaking = false; if (active){ setS("listening"); listen(); } } };
  utter++; synth.speak(u);
}

async function ask(text){
  history.push({role:"user", content:text});
  bubble("u", text);
  setS("thinking"); hint("");
  if (!$("barge").checked) try{ rec.stop(); }catch(e){}
  ctrl = new AbortController(); streaming = true;
  const out = bubble("a", ""); let full = "", buf = "";
  try{
    const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:history}), signal:ctrl.signal});
    if (!res.ok) throw new Error((await res.text()).slice(0, 300));
    const rd = res.body.getReader(), dec = new TextDecoder();
    while (true){
      const {done, value} = await rd.read(); if (done) break;
      const chunk = dec.decode(value, {stream:true});
      full += chunk; buf += chunk; out.textContent = full;
      $("log").scrollTop = $("log").scrollHeight;
      let m;
      while ((m = buf.match(/^[\s\S]*?[.!?؟۔\n]+(\s|$)/))){ speak(m[0]); buf = buf.slice(m[0].length); }
    }
    if (buf.trim()) speak(buf);
    if (full) history.push({role:"assistant", content:full});
  }catch(err){
    if (err.name !== "AbortError"){
      out.textContent = "Assistant error: " + err.message;
      setS("idle");
    }
  }
  streaming = false;
  if (utter === 0){ speaking = false; if (active){ setS("listening"); listen(); } }
}

$("go").onclick = () => {
  if (!SR){ hint("This browser has no speech recognition. Use Chrome or Edge."); return; }
  if (active){
    active = false; interrupt(); try{ rec.stop(); }catch(e){}
    $("go").textContent = "Start"; setS("idle"); hint("Press Start and begin speaking.");
  } else {
    active = true; makeRec(); $("go").textContent = "Stop"; listen();
  }
};
$("clear").onclick = () => { history = []; $("log").innerHTML = '<p class="empty">Your conversation will appear here.</p>'; };
$("lang").onchange = () => { if (active){ try{ rec.stop(); }catch(e){} makeRec(); setTimeout(listen, 200); } };
$("theme").onclick = () => {
  const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue("--bg").trim() === "#12141f";
  r.dataset.theme = dark ? "light" : "dark";
};
</script>
</body>
</html>
